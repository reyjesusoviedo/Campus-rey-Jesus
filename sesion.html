<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clase · Campus Rey Jesús Oviedo</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/piloto.css">
<link rel="stylesheet" href="assets/clase.css">
</head>
<body class="clase">
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<header class="c-top" id="c-top"><a class="brand" href="panel.html" data-brand></a><p class="meta" id="loading">Cargando la clase…</p></header>
<main class="c-main" id="contenido" hidden>
  <section class="c-center" id="c-center">
    <div class="c-tabs" id="c-tabs" role="tablist"></div>
    <div class="c-stage" id="main" aria-live="polite"></div>
  </section>
  <aside class="c-side" id="c-side">
    <div class="c-tabs" id="tabs" role="tablist"></div>
    <div class="c-side-body" id="side"></div>
  </aside>
  <section class="c-bottom" id="c-bottom"></section>
</main>
<footer class="c-tools" id="c-tools" hidden></footer>
<button class="button help-btn" id="help-btn" hidden aria-pressed="false">Pido ayuda</button>
<div class="reply-bar" id="reply-bar" hidden>
  <div class="reply-bar-inner">
    <button class="icon-button reply-help" id="bar-help" aria-label="Pido ayuda" title="Pido ayuda" aria-pressed="false">✋</button>
    <div class="reply-field"><span class="reply-label" id="bar-label"></span><textarea id="bar-text" rows="1" placeholder="Escribe tu respuesta…"></textarea></div>
    <button class="button reply-send" id="bar-send">Enviar</button>
  </div>
  <p class="reply-status" id="bar-status" hidden></p>
</div>
<dialog id="dialog" aria-labelledby="dialog-title" style="border:0;border-radius:18px;padding:26px;width:min(560px,92vw)">
  <div class="panel-head"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Cerrar">×</button></div>
  <div id="dialog-body"></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/sesion.js"></script>
</body>
</html>
