<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clase · Campus Rey Jesús Oviedo</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/piloto.css">
</head>
<body class="live-class">
<a class="skip-link" href="#contenido">Saltar al contenido</a>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="panel.html" data-brand></a>
    <nav class="nav-list">
      <a class="nav-link" data-nav="panel" href="panel.html">Mis grupos</a>
      <a class="nav-link active" data-nav="sesion" href="#" aria-current="page">Clase</a>
    </nav>
    <div class="sidebar-foot" data-profile></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><button class="menu-button" data-menu aria-label="Abrir menú">☰</button><strong id="top-title">Clase</strong><span id="top-status" class="meta" style="margin-left:auto"></span></header>
    <main class="page" id="contenido">
      <p id="loading" class="meta">Cargando la clase…</p>
      <div id="app" hidden>
        <div class="session-top" id="session-top"></div>
        <div id="brief"></div>
        <div class="live-grid">
          <section class="panel live-activity" id="main" aria-live="polite"></section>
          <aside class="panel live-side">
            <div class="live-tabs" id="tabs" role="group" aria-label="Panel lateral"></div>
            <div class="live-side-body" id="side"></div>
          </aside>
        </div>
      </div>
    </main>
  </div>
</div>
<button class="button help-btn" id="help-btn" hidden aria-pressed="false">Pido ayuda</button>
<div class="reply-bar" id="reply-bar" hidden>
  <div class="reply-bar-inner">
    <button class="icon-button reply-help" id="bar-help" aria-label="Pido ayuda" title="Pido ayuda" aria-pressed="false">✋</button>
    <div class="reply-field"><span class="reply-label" id="bar-label"></span><textarea id="bar-text" rows="1" placeholder="Escribe tu respuesta…"></textarea></div>
    <button class="button reply-send" id="bar-send">Enviar</button>
  </div>
  <p class="reply-status" id="bar-status" hidden></p>
</div>
<dialog id="dialog" aria-labelledby="dialog-title" style="border:0;border-radius:18px;padding:26px;width:min(560px,92vw)">
  <div class="panel-head"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="Cerrar">×</button></div>
  <div id="dialog-body"></div>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/db.js"></script>
<script src="assets/sesion.js"></script>
</body>
</html>
