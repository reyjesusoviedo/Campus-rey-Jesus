<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Campus Rey Jesús Oviedo</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/piloto.css">
</head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand" data-brand></div>
  <h1>Entrar al campus</h1>
  <p class="subtle" style="margin:0">Acceso solo con invitación de tu maestro o maestra.</p>

  <div class="auth-switch" role="group" aria-label="Forma de entrar">
    <button type="button" data-mode="guest" aria-pressed="false">Invitado</button>
    <button type="button" data-mode="signup" aria-pressed="true">Primera vez</button>
    <button type="button" data-mode="magic" aria-pressed="false">Ya tengo cuenta</button>
    <button type="button" data-mode="password" aria-pressed="false">Contraseña</button>
  </div>

  <div class="field" id="name-field"><label for="name">Tu nombre y apellido</label><input id="name" autocomplete="name"></div>
  <div class="field" id="code-field" hidden><label for="class-code">Código de la clase</label><input id="class-code" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.3rem"></div>
  <div class="field" id="email-field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" required></div>
  <div class="field" id="pass-field" hidden><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div>
  <p class="form-error" id="error" role="alert"></p>
  <button class="button" id="go" style="width:100%">Crear mi acceso</button>
  <p class="meta" id="hint" style="margin-top:14px">Recibirás un enlace en tu correo para entrar, sin contraseña. Después, dentro, escribe el <strong>código del grupo</strong> que te ha dado tu maestro.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/db.js"></script>
<script>
(async () => {
  const { sb, cfg, esc, toast } = Campus;
  document.querySelector("[data-brand]").innerHTML = `<span class="brand-mark">${esc(cfg.brandShort)}</span><span>${esc(cfg.brand)}<small>${esc(cfg.tagline)}</small></span>`;

  // Si ya hay sesión (o llega desde un enlace mágico), entrar directamente
  const wantsGuest = !!new URLSearchParams(location.search).get("clase");
  sb.auth.onAuthStateChange((event, session) => { if (session && !wantsGuest) location.replace("panel.html"); });
  const { data: { session } } = await sb.auth.getSession();
  if (session && !wantsGuest) { location.replace("panel.html"); return; }

  let mode = "signup";
  const err = document.getElementById("error");
  const preCode = new URLSearchParams(location.search).get("clase");
  if (preCode) { document.getElementById("class-code").value = preCode.toUpperCase(); setTimeout(() => document.querySelector('[data-mode="guest"]').click(), 0); }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.getElementById("pass-field").hidden = mode !== "password";
    document.getElementById("name-field").hidden = !(mode === "signup" || mode === "guest");
    document.getElementById("code-field").hidden = mode !== "guest";
    document.getElementById("email-field").hidden = mode === "guest";
    document.getElementById("go").textContent = mode === "password" ? "Entrar" : mode === "signup" ? "Crear mi acceso" : mode === "guest" ? "Entrar a la clase" : "Enviarme el enlace";
    document.getElementById("hint").textContent = mode === "guest" ? "Solo para esta clase, sin correo ni contraseña. Tu maestro te da el código de la clase. Si cierras el navegador, tendrás que volver a entrar." : mode === "signup" ? "Recibirás un enlace en tu correo para entrar, sin contraseña. Después, dentro, escribe el código del grupo que te ha dado tu maestro." : mode === "magic" ? "Te enviaremos un enlace al correo con el que te diste de alta." : "Acceso con contraseña para maestros y coordinación.";
    err.textContent = "";
  }));

  document.getElementById("go").addEventListener("click", async () => {
    err.textContent = "";
    const btn = document.getElementById("go");
    if (mode === "guest") {
      const name = document.getElementById("name").value.trim(), code = document.getElementById("class-code").value.trim().toUpperCase();
      if (!name || code.length < 6) { err.textContent = "Escribe tu nombre y el código de 6 letras."; return; }
      btn.disabled = true;
      try {
        const { data: { session: cur } } = await sb.auth.getSession();
        if (!cur) { const { error } = await sb.auth.signInAnonymously({ options: { data: { full_name: name } } }); if (error) { err.textContent = error.message.includes("Anonymous") ? "El acceso de invitados no está activado. Avisa a coordinación." : error.message; return; } }
        const { data: sid, error } = await sb.rpc("join_session_as_guest", { p_code: code, p_name: name });
        if (error) { err.textContent = "Código de clase no válido o clase terminada."; return; }
        location.replace("sesion.html?id=" + sid);
      } finally { btn.disabled = false; }
      return;
    }
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email) { err.textContent = "Escribe tu correo."; return; }
    btn.disabled = true;
    try {
      if (mode === "password") {
        if (!password) { err.textContent = "Escribe tu contraseña."; return; }
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { err.textContent = "Correo o contraseña incorrectos."; return; }
        location.replace("panel.html");
      } else {
        const name = document.getElementById("name").value.trim();
        if (mode === "signup" && !name) { err.textContent = "Escribe tu nombre."; return; }
        const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: mode === "signup", data: { full_name: name || undefined }, emailRedirectTo: location.href.replace(/[^/]*$/, "index.html") } });
        if (error) { err.textContent = error.message.includes("Signups") ? "Este correo no tiene acceso. Usa la pestaña «Primera vez»." : error.message; return; }
        toast("Enlace enviado. Revisa tu correo.");
        document.getElementById("hint").textContent = "Te hemos enviado un enlace a " + email + ". Ábrelo desde este mismo dispositivo.";
      }
    } finally { btn.disabled = false; }
  });
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
})();
</script>
</body>
</html>
