<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Campus Rey Jesús Oviedo</title>
<link rel="stylesheet" href="assets/styles.css?v=1.0.20260919151607">
<link rel="stylesheet" href="assets/piloto.css?v=1.0.20260919151607">
<script>
(function(){
  window.__campusBoot = { step: "inicio", t0: Date.now() };
  function fail(msg, detail){
    if (document.getElementById("boot-fail")) return;
    var d = document.createElement("div");
    d.id = "boot-fail";
    d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#0b2f6b;color:#fff;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif";
    d.innerHTML = '<div style="background:#fff;color:#101827;border-radius:18px;padding:24px;max-width:420px;text-align:center">'
      + '<h1 style="font-family:Georgia,serif;font-size:1.3rem;margin:0 0 8px">No se pudo abrir el campus</h1>'
      + '<p style="color:#5b6673;margin:0 0 6px">' + msg + '</p>'
      + '<p style="color:#9aa6b2;font-size:12px;margin:0 0 14px">Paso: ' + (window.__campusBoot.step || "?") + (detail ? " · " + String(detail).slice(0,120) : "") + '</p>'
      + '<button id="bf-r" style="border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;background:#0c70bb;color:#fff;width:100%">Reintentar</button>'
      + '<p style="color:#9aa6b2;font-size:11px;margin:10px 0 0">v' + ((window.CAMPUS_CONFIG && window.CAMPUS_CONFIG.version) || '?') + '</p></div>';
    document.body.appendChild(d);
    document.getElementById("bf-r").onclick = function(){ location.reload(); };
  }
  window.__campusFail = fail;
  window.addEventListener("error", function(e){
    if (e.target && e.target.tagName === "SCRIPT") fail("No se pudo descargar una parte del campus. Comprueba tu conexión.", e.target.src);
  }, true);
  setTimeout(function(){
    if (!window.__campusBoot.assetsReady) fail("No se han podido cargar los archivos del campus.", "");
  }, 9000);
})();
</script>
<script>
(function(){
  // Comprobar si hay una versión más nueva publicada y, si la hay, recargar una sola vez
  try {
    var mine = "1.0.20260919151607";
    var last = sessionStorage.getItem("verReload") || "";
    fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(t){
        if (!t) return;
        var live = t.trim();
        if (live && live !== mine && last !== live) {
          sessionStorage.setItem("verReload", live);
          location.replace(location.pathname + (location.search ? location.search + "&" : "?") + "v=" + live + location.hash);
        }
      })
      .catch(function(){});
  } catch (e) {}
})();
</script>
</head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand" data-brand></div>
  <h1>Entrar al campus</h1>
  <p class="subtle" style="margin:0">Invitado: entra con tu código. Registrado: con tu correo y contraseña.</p>

  <div class="auth-switch" role="group" aria-label="Forma de entrar">
    <button type="button" data-mode="guest" aria-pressed="false">Tengo un código</button>
    <button type="button" data-mode="password" aria-pressed="true">Correo y contraseña</button>
    <button type="button" data-mode="signup" aria-pressed="false" hidden>Apuntarme</button>
  </div>

  <div class="field" id="name-field"><label for="name">Tu nombre y apellido</label><input id="name" autocomplete="name"></div>
  <div class="field" id="phone-field" hidden><label for="phone">Teléfono (WhatsApp)</label><input id="phone" type="tel" autocomplete="tel" placeholder="+34 …"></div>
  <div class="field" id="code-field" hidden><label for="class-code">Código de la clase o del grupo</label><input id="class-code" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;text-align:center;font-size:1.3rem"></div>
  <div class="field" id="email-field"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" required></div>
  <div class="field" id="pass-field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div>
  <p class="form-error" id="error" role="alert"></p>
  <button class="button" id="go" style="width:100%">Entrar</button>
  <p class="meta" id="forgot" hidden style="margin-top:10px;text-align:center"><a href="#" id="forgot-link">¿Olvidaste la contraseña?</a></p>
  <p class="meta" id="hint" style="margin-top:14px">Si te han dado de alta en el campus, entra con tu correo y la contraseña que te pasaron. Puedes cambiarla luego en «Mi perfil».</p>
</main>

<script src="assets/vendor/supabase.js?v=1.0.20260919151607"></script>
<script src="assets/config.js?v=1.0.20260919151607"></script>
<script src="assets/db.js?v=1.0.20260919151607"></script>
<script>
(async () => {
  const { sb, cfg, esc, toast } = Campus;
  await Campus.loadSettings();
  document.querySelector("[data-brand]").innerHTML = `${Campus.brandMark()}<span>${esc(cfg.brand)}<small>${esc(cfg.tagline)}</small></span>`;

  // Si ya hay sesión (o llega desde un enlace mágico), entrar directamente
  const wantsGuest = !!new URLSearchParams(location.search).get("clase"), hasInvite = !!new URLSearchParams(location.search).get("equipo") || !!new URLSearchParams(location.search).get("curso") || !!new URLSearchParams(location.search).get("recuperar") || /type=recovery/.test(location.hash);
  const specialFlow = wantsGuest || hasInvite;
  sb.auth.onAuthStateChange(async (event, session) => {
    if (!session || specialFlow || event === "PASSWORD_RECOVERY") return;
    if (session.user.is_anonymous) { const { data: gs } = await sb.rpc("my_guest_session"); location.replace(gs ? "sesion.html?id=" + gs : "entrar.html"); return; }
    location.replace("panel.html");
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session && !wantsGuest && !hasInvite) {
    if (session.user.is_anonymous) { const { data: gs } = await sb.rpc("my_guest_session"); if (gs) { location.replace("sesion.html?id=" + gs); return; } }
    else { location.replace("panel.html"); return; }
  }

  let mode = "password";
  const err = document.getElementById("error");
  { const c = new URLSearchParams(location.search).get("clase"); const { data: { session: cs } } = await sb.auth.getSession();
    if (c) { location.replace("clase.html?c=" + encodeURIComponent(c)); return; }
    // Invitado que ya está dentro de una clase: se le devuelve a ella
    if (cs && cs.user.is_anonymous) { const { data: gs } = await sb.rpc("my_guest_session"); if (gs) { location.replace("sesion.html?id=" + gs); return; } } }
  const courseSlug = new URLSearchParams(location.search).get("curso");
  if (courseSlug) {
    try { localStorage.setItem("pendingCourse", courseSlug); } catch {}
    const { data: c } = await sb.from("courses").select("title, type").eq("slug", courseSlug).maybeSingle();
    document.getElementById("phone-field").hidden = false;
    document.querySelector('[data-mode="signup"]').hidden = false; document.querySelector('[data-mode="signup"]').textContent = "Apuntarme";
    document.querySelector(".auth-card h1").textContent = c ? "Apúntate a «" + c.title + "»" : "Apúntate";
    setTimeout(() => document.querySelector('[data-mode="signup"]').click(), 0);
    const { data: { session: cur } } = await sb.auth.getSession(); if (cur && !cur.user.is_anonymous) { location.replace("panel.html"); return; }
  }
  const inviteToken = new URLSearchParams(location.search).get("equipo");
  if (inviteToken) {
    try { localStorage.setItem("staffInvite", inviteToken); } catch {}
    const { data: info } = await sb.rpc("staff_invite_info", { p_token: inviteToken });
    if (!info) err.textContent = "Esta invitación no existe. Pide una nueva a coordinación.";
    else if (info.expired) err.textContent = "Esta invitación ha caducado. Pide a coordinación que la renueve.";
    else {
      document.getElementById("name").value = info.full_name || ""; document.getElementById("email").value = info.email || "";
      document.querySelector(".auth-card h1").textContent = "Bienvenido al equipo";
      document.getElementById("hint").innerHTML = `Te han dado de alta como <strong>${info.role === "coordinator" ? "coordinación" : "maestro/a"}</strong>${info.group ? " del grupo <strong>" + info.group + "</strong>" : ""}.${info.message ? "<br>«" + info.message + "»" : ""}<br>Pulsa el botón: recibirás un enlace en tu correo y al abrirlo ya estarás dentro con tu rol.`;
      const { data: { session: cur } } = await sb.auth.getSession(); if (cur) { location.replace("resumen.html"); return; }
    }
  }
  const preCode = new URLSearchParams(location.search).get("clase");
  if (preCode) { try { localStorage.setItem("pendingClass", preCode.toUpperCase()); } catch {} document.getElementById("class-code").value = preCode.toUpperCase(); setTimeout(() => document.querySelector('[data-mode="guest"]').click(), 0);
    const { data: { session: cur } } = await sb.auth.getSession(); if (cur && !cur.user.is_anonymous) { location.replace("panel.html"); return; } }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b));
    document.getElementById("pass-field").hidden = mode !== "password";
    document.getElementById("forgot").hidden = mode !== "password";
    document.getElementById("name-field").hidden = !(mode === "signup" || mode === "guest");
    document.getElementById("code-field").hidden = mode !== "guest";
    document.getElementById("email-field").hidden = mode === "guest";
    document.getElementById("go").textContent = mode === "password" ? "Entrar" : mode === "signup" ? "Apuntarme" : mode === "guest" ? "Entrar a la clase" : "Enviarme el enlace";
    document.getElementById("pass-field").hidden = !(mode === "password" || mode === "signup");
    document.getElementById("hint").textContent = mode === "guest" ? "Sin correo ni contraseña: escribe tu nombre y el código que te ha dado tu maestro (de la clase o del grupo). Tu acceso se guarda en este dispositivo." : mode === "signup" ? "Gratuito. Elige una contraseña y entrarás directamente a tu curso." : "Si te han dado de alta en el campus, entra con tu correo y la contraseña que te pasaron. Puedes cambiarla luego en «Mi perfil».";
    err.textContent = "";
  }));

  document.getElementById("go").addEventListener("click", async () => {
    err.textContent = "";
    const btn = document.getElementById("go");
    if (mode === "guest") {
      const name = document.getElementById("name").value.trim(), code = document.getElementById("class-code").value.trim().toUpperCase();
      if (!name || code.length < 6) { err.textContent = "Escribe tu nombre y el código de 6 letras."; return; }
      btn.disabled = true;
      try {
        const { data: { session: cur } } = await sb.auth.getSession();
        if (!cur) { const { error } = await sb.auth.signInAnonymously({ options: { data: { full_name: name } } }); if (error) { err.textContent = error.message.includes("Anonymous") ? "El acceso de invitados no está activado. Avisa a coordinación." : error.message; return; } }
        const { data, error } = await sb.rpc("join_class", { p_code: code, p_name: name });
        if (error) { err.textContent = Campus.codeMessage(error.message); return; }
        const sid = data && data.session_id;
        if (!sid) { err.textContent = Campus.codeMessage("SIN_CLASE"); return; }
        location.replace("sesion.html?id=" + sid);
      } finally { btn.disabled = false; }
      return;
    }
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!email) { err.textContent = "Escribe tu correo."; return; }
    btn.disabled = true;
    try {
      if (mode === "signup") {
        const name = document.getElementById("name").value.trim(), phone = document.getElementById("phone").value.trim();
        if (!name) { err.textContent = "Escribe tu nombre."; return; } if (!document.getElementById("phone-field").hidden && !phone) { err.textContent = "Escribe tu teléfono."; return; } if (password.length < 6) { err.textContent = "Elige una contraseña de al menos 6 caracteres."; return; }
        try { if (phone) localStorage.setItem("pendingPhone", phone); } catch {}
        const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name, phone: phone || undefined }, emailRedirectTo: location.href.replace(/[^/]*$/, "entrar.html") + (courseSlug ? "?curso=" + encodeURIComponent(courseSlug) : "") } });
        if (error) { err.textContent = error.message.includes("already") ? "Ese correo ya está registrado: entra con tu contraseña." : error.message; return; }
        if (data.session) { location.replace("panel.html"); return; }
        toast("Revisa tu correo para confirmar la cuenta."); document.getElementById("hint").textContent = "Te hemos enviado un correo a " + email + " para confirmar tu cuenta. Ábrelo y entra con tu contraseña.";
        return;
      }
      if (mode === "password") {
        if (!password) { err.textContent = "Escribe tu contraseña."; return; }
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) { err.textContent = "Correo o contraseña incorrectos."; return; }
        location.replace("panel.html");
      } else {
        const name = document.getElementById("name").value.trim(), phone = document.getElementById("phone").value.trim();
        if (mode === "signup" && !name) { err.textContent = "Escribe tu nombre."; return; }
        if (mode === "signup" && !document.getElementById("phone-field").hidden && !phone) { err.textContent = "Escribe tu teléfono."; return; }
        try { if (phone) localStorage.setItem("pendingPhone", phone); } catch {}
        const { error } = await sb.auth.signInWithOtp({ email, options: { shouldCreateUser: mode === "signup", data: { full_name: name || undefined, phone: phone || undefined }, emailRedirectTo: location.href.replace(/[^/]*$/, "entrar.html") + (courseSlug ? "?curso=" + encodeURIComponent(courseSlug) : inviteToken ? "?equipo=" + encodeURIComponent(inviteToken) : preCode ? "?clase=" + encodeURIComponent(preCode) : "") } });
        if (error) { err.textContent = error.message.includes("Signups") ? "Este correo no tiene acceso. Usa la pestaña «Primera vez»." : error.message; return; }
        toast("Enlace enviado. Revisa tu correo.");
        document.getElementById("hint").textContent = "Te hemos enviado un enlace a " + email + ". Ábrelo desde este mismo dispositivo.";
      }
    } finally { btn.disabled = false; }
  });
  document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
  if (!preCode && !courseSlug) document.querySelector('[data-mode="password"]').click();
  document.getElementById("forgot-link").addEventListener("click", async e => {
    e.preventDefault(); const email = document.getElementById("email").value.trim(); if (!email) { err.textContent = "Escribe tu correo y vuelve a pulsar."; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.replace(/[^/]*$/, "entrar.html") + "?recuperar=1" });
    err.textContent = ""; toast(error ? error.message : "Te hemos enviado un correo para crear una contraseña nueva.");
  });
  // Volver desde el correo de recuperación: pedir contraseña nueva
  if (new URLSearchParams(location.search).get("recuperar") || /type=recovery/.test(location.hash)) {
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY" || (session && new URLSearchParams(location.search).get("recuperar"))) {
        const pw = prompt("Escribe tu contraseña nueva (mínimo 6 caracteres):"); if (!pw) return;
        const { error } = await sb.auth.updateUser({ password: pw }); toast(error ? error.message : "Contraseña guardada"); if (!error) location.replace("panel.html");
      }
    });
  }
})();
</script>
<p id="campus-ver" style="position:fixed;bottom:6px;left:0;right:0;text-align:center;font:11px Inter,sans-serif;color:rgba(255,255,255,.55);margin:0"></p>
<script>document.getElementById("campus-ver").textContent="v"+(window.CAMPUS_CONFIG&&window.CAMPUS_CONFIG.version||"?");</script>
</body>
</html>
