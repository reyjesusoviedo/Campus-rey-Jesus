<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clase en directo · Campus Rey Jesús Oviedo</title>
<link rel="stylesheet" href="assets/styles.css?v=1.0.20260919151607">
<link rel="stylesheet" href="assets/piloto.css?v=1.0.20260919151607">
<style>
  body { background: var(--paper); }
  .view-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px; background: var(--navy); color: white; }
  .view-top .brand { color: white; padding: 0; }
  .view-top h1 { margin: 0; font-family: Georgia, serif; font-size: 1.2rem; flex: 1; min-width: 200px; }
  .view-top .meta { color: #c9d2dc; }
  .view-body { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .stage { min-height: 70vh; }
  .stage-frame { height: 80vh; }
  .view-wait { padding: 60px 20px; text-align: center; color: var(--muted); }
  .view-wait h2 { font-family: Georgia, serif; color: var(--ink); }
</style>
<script>
(function(){
  window.__campusBoot = { step: "inicio", t0: Date.now() };
  function fail(msg, detail){
    if (document.getElementById("boot-fail")) return;
    var d = document.createElement("div");
    d.id = "boot-fail";
    d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#0b2f6b;color:#fff;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif";
    d.innerHTML = '<div style="background:#fff;color:#101827;border-radius:18px;padding:24px;max-width:420px;text-align:center">'
      + '<h1 style="font-family:Georgia,serif;font-size:1.3rem;margin:0 0 8px">No se pudo abrir el campus</h1>'
      + '<p style="color:#5b6673;margin:0 0 6px">' + msg + '</p>'
      + '<p style="color:#9aa6b2;font-size:12px;margin:0 0 14px">Paso: ' + (window.__campusBoot.step || "?") + (detail ? " · " + String(detail).slice(0,120) : "") + '</p>'
      + '<button id="bf-r" style="border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;background:#0c70bb;color:#fff;width:100%">Reintentar</button>'
      + '<p style="color:#9aa6b2;font-size:11px;margin:10px 0 0">v' + ((window.CAMPUS_CONFIG && window.CAMPUS_CONFIG.version) || '?') + '</p></div>';
    document.body.appendChild(d);
    document.getElementById("bf-r").onclick = function(){ location.reload(); };
  }
  window.__campusFail = fail;
  window.addEventListener("error", function(e){
    if (e.target && e.target.tagName === "SCRIPT") fail("No se pudo descargar una parte del campus. Comprueba tu conexión.", e.target.src);
  }, true);
  setTimeout(function(){
    if (!window.__campusBoot.assetsReady) fail("No se han podido cargar los archivos del campus.", "");
  }, 9000);
})();
</script>
<script>
(function(){
  // Comprobar si hay una versión más nueva publicada y, si la hay, recargar una sola vez
  try {
    var mine = "1.0.20260919151607";
    var last = sessionStorage.getItem("verReload") || "";
    fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(t){
        if (!t) return;
        var live = t.trim();
        if (live && live !== mine && last !== live) {
          sessionStorage.setItem("verReload", live);
          location.replace(location.pathname + (location.search ? location.search + "&" : "?") + "v=" + live + location.hash);
        }
      })
      .catch(function(){});
  } catch (e) {}
})();
</script>
</head>
<body>
<header class="view-top"><a class="brand" href="entrar.html" data-brand></a><h1 id="title">Clase</h1><span class="meta" id="status"></span><a class="button gold small" id="join" hidden>Participar</a></header>
<main class="view-body" id="main"><div class="view-wait"><p>Conectando…</p></div></main>
<script src="assets/vendor/supabase.js?v=1.0.20260919151607"></script>
<script src="assets/config.js?v=1.0.20260919151607"></script>
<script src="assets/db.js?v=1.0.20260919151607"></script>
<script>
(async () => {
  const { sb, cfg, esc } = Campus;
  await Campus.loadSettings();
  document.querySelector("[data-brand]").innerHTML = `${Campus.brandMark()}<span>${esc(cfg.brand)}<small>${esc(cfg.tagline)}</small></span>`;
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  const main = document.getElementById("main");
  if (!code) { main.innerHTML = `<div class="view-wait"><h2>Falta el código</h2><p>Pide a tu maestro el enlace de «solo ver».</p></div>`; return; }
  document.getElementById("join").href = "clase.html?c=" + code; document.getElementById("join").hidden = false;
  let currentMaterial = null, frame = null, lastSection = null; const cache = {};
  const LESSON_GUARD = '<script>(function(){var role=null;document.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\")||\"\";if(h.charAt(0)===\"#\"){e.preventDefault();var id=decodeURIComponent(h.slice(1));var el=id?document.getElementById(id):null;if(el)el.scrollIntoView({behavior:\"smooth\",block:\"start\"});else if(!id)window.scrollTo({top:0,behavior:\"smooth\"});}else if(/^https?:/i.test(h)){a.setAttribute(\"target\",\"_blank\");a.setAttribute(\"rel\",\"noopener\");}},true);document.addEventListener(\"submit\",function(e){e.preventDefault();},true);window.addEventListener(\"message\",function(e){var d=e.data||{};if(d.campus!==\"campus\")return;if(d.type===\"context\")role=d.role;if(d.type===\"goto\"&&typeof d.section===\"string\"&&d.section.indexOf(\"scroll:\")===0){var r=parseFloat(d.section.slice(7))||0;var h=document.documentElement.scrollHeight-window.innerHeight;window.scrollTo({top:r*h,behavior:\"smooth\"});}});setTimeout(function(){if(window.CampusBridge)return;var t;window.addEventListener(\"scroll\",function(){if(role!==\"teacher\")return;clearTimeout(t);t=setTimeout(function(){var h=document.documentElement.scrollHeight-window.innerHeight;var r=h>0?window.scrollY/h:0;if(parent!==window)parent.postMessage({campus:\"lesson\",type:\"position\",section:\"scroll:\"+r.toFixed(3),label:\"Desplazamiento\"},\"*\");},250);},{passive:true});if(parent!==window)parent.postMessage({campus:\"lesson\",type:\"ready\",basic:true},\"*\");},700);})();(function(){function h(){return Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0);}function send(){if(parent!==window)parent.postMessage({campus:\"lesson\",type:\"height\",h:h()},\"*\");}window.addEventListener(\"load\",send);setTimeout(send,300);setTimeout(send,1500);if(window.ResizeObserver){new ResizeObserver(send).observe(document.documentElement);}window.addEventListener(\"message\",function(e){var d=e.data||{};if(d.campus!==\"campus\")return;if(d.type===\"goto\"&&typeof d.section===\"string\"){var y=null;if(d.section.indexOf(\"scroll:\")===0){y=(parseFloat(d.section.slice(7))||0)*h();}else{var el=document.getElementById(d.section);if(el)y=el.getBoundingClientRect().top+window.scrollY;}if(y!==null&&parent!==window)parent.postMessage({campus:\"lesson\",type:\"scrollto\",y:y},\"*\");}});})();<\/script>';
  function guardLesson(html) { return /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + LESSON_GUARD) : LESSON_GUARD + html; }
  function post(msg) { try { frame?.contentWindow?.postMessage(Object.assign({ campus: "campus" }, msg), "*"); } catch {} }
  window.addEventListener("message", e => { const d = e.data || {}; if (d.campus === "lesson" && d.type === "ready" && frame && e.source === frame.contentWindow) { post({ type: "context", role: "viewer", follow: true }); if (lastSection) post({ type: "goto", section: lastSection }); } });
  async function mount(m) {
    currentMaterial = m.id; frame = null;
    main.innerHTML = `<div class="stage-head"><span class="eyebrow">En pantalla</span><strong>${esc(m.title)}</strong><button class="button secondary small" id="full">Pantalla completa</button></div><div class="stage" id="stage"></div>`;
    document.getElementById("full").addEventListener("click", () => { const el = document.getElementById("stage"); (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); });
    const stage = document.getElementById("stage");
    if (m.kind === "text") { stage.innerHTML = `<div class="material-text stage-text">${esc(m.content)}</div>`; return; }
    frame = document.createElement("iframe"); frame.className = "stage-frame"; frame.title = m.title; stage.appendChild(frame);
    if (m.kind === "link") { frame.src = m.url; return; }
    if (/\.html?$/i.test(m.storage_path || "")) {
      frame.setAttribute("sandbox", "allow-scripts allow-same-origin");
      if (!cache[m.id]) { const { data, error } = await sb.storage.from(m.bucket || "materials").download(m.storage_path); if (error) { stage.innerHTML = `<p class="notice">No se pudo cargar la lección.</p>`; return; } cache[m.id] = await data.text(); }
      frame.srcdoc = guardLesson(cache[m.id]); return;
    }
    const { data, error } = await sb.storage.from(m.bucket || "materials").createSignedUrl(m.storage_path, 3600);
    if (error) { stage.innerHTML = `<p class="notice">No se pudo cargar el archivo.</p>`; return; }
    frame.src = data.signedUrl;
  }
  async function tick() {
    const { data, error } = await sb.rpc("public_session_view", { p_code: code });
    if (error || !data) { main.innerHTML = `<div class="view-wait"><h2>Esta clase no está en modo «solo ver»</h2><p>Pide a tu maestro que lo active o entra como invitado con el botón «Participar».</p></div>`; currentMaterial = null; return; }
    document.getElementById("title").textContent = data.title + " · " + data.group;
    document.getElementById("status").textContent = data.status === "live" ? "En directo" : data.status === "closed" ? "Terminada" : "Sin iniciar";
    if (!data.material) { if (currentMaterial !== null || !main.querySelector(".view-wait")) main.innerHTML = `<div class="view-wait"><h2>${data.status === "live" ? "El maestro todavía no ha proyectado nada" : "La clase aún no ha empezado"}</h2><p>Esta pantalla se actualiza sola.</p></div>`; currentMaterial = null; return; }
    if (data.material.id !== currentMaterial) await mount(data.material);
    const sec = data.state?.section; if (sec && sec !== lastSection) { lastSection = sec; post({ type: "goto", section: sec }); }
  }
  await tick(); setInterval(tick, 4000);
})();
</script>
</body>
</html>
